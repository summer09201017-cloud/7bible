  <head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        let didReload = false;
        const reloadOnce = () => {
          if (didReload) return;
          didReload = true;
          window.location.reload();
        };
        navigator.serviceWorker.addEventListener('controllerchange', reloadOnce);
        navigator.serviceWorker.addEventListener('message', (e) => {
          if (e.data?.type === 'SW_UPDATED') reloadOnce();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
            const handleNew = (worker) => {
              if (!worker) return;
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  worker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            };
            handleNew(reg.installing);
            handleNew(reg.waiting);
            reg.addEventListener('updatefound', () => handleNew(reg.installing));
            setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
          });
        });
      }
    </script>
    <script>
    // play-stats 匿名計數 + 真實停留(讀經站,同 8bible 語意):開啟 10 分去重;停留=累計可見時間分段回報(-done/-tadd),最近一次=-dwlast
    (function(){
      if (['localhost','127.0.0.1'].includes(location.hostname) || location.protocol==='file:') return;
      window.psPing = function(key, t, last){
        try { var u='https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g='+key+(t?'&t='+t:'')+(last?'&last='+last:'');
          if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u,{mode:'no-cors'}); } catch(e){}
      };
      try { var k='ps-last-7bible', now=Date.now(), last=parseInt(localStorage.getItem(k)||'0',10);
        if (now-last>600000){ localStorage.setItem(k,String(now)); window.psPing('7bible'); } } catch(e){ window.psPing('7bible'); }
      var visStart = document.visibilityState!=='hidden' ? Date.now() : 0, sentDone=false, total=0;
      function flush(){
        if (!visStart) return;
        var sec=Math.round((Date.now()-visStart)/1000); visStart=0;
        if (sec<3||sec>1800) return;
        total+=sec;
        window.psPing('7bible-'+(sentDone?'tadd':'done'), sec, Math.min(total,1800)); sentDone=true; // 修07-25:最近一次(last)併進同一發,免手機丟第二發 -dwlast
      }
      window.addEventListener('pagehide', flush);
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState==='hidden') flush();
        else if (!visStart) visStart=Date.now();
      });
      // 心跳(07-25):讀經途中每 25 秒把目前累計停留更新到最近一次(複用 -dwlast,只動 dl:、不動平均)
      setInterval(function(){ if(!visStart) return; var live=Math.min(total+Math.round((Date.now()-visStart)/1000),1800); if(live>=3) window.psPing('7bible-dwlast', live); }, 25000);
    })();
    </script>
  <div id="appVerBadge" style="position:fixed;right:6px;bottom:4px;font-size:11px;line-height:1;opacity:.55;z-index:2147483000;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);font-family:system-ui,sans-serif"></div>
    <script>
      /* 🏷️ appVerBadgeFade（0828）：版號徽章是 position:fixed 在右下角，實測會蓋住大廳卡片、
         遊戲的「難度 / 開始比賽」按鈕——pointer-events:none 只讓「點擊」穿過去，字還是被蓋著。
         做法：10 秒後淡出。要看版本就重新整理，平常不擋畫面。 */
      ;(function () {
        var b = document.getElementById('appVerBadge')
        if (!b) return
        b.style.transition = 'opacity .8s'
        setTimeout(function () {
          b.style.opacity = '0'
          setTimeout(function () { b.style.display = 'none' }, 900)
        }, 10000)
      })()
    </script>
<script>
/* 🏷️ 版號徽章(0820 全艦隊批次):問「正在控制本頁的 SW」拿版本=你手上真的在跑的那一版,
   頁面不寫死任何版號(不會漂)。硬重整(Ctrl+F5)的分頁不受 SW 管、問不到 → 誠實顯示退路
   (股票管家 v134 同款);SW 換版接管時會再問,自動換新。 */
(function () {
  var el = document.getElementById('appVerBadge');
  if (!el || !('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  var got = false;
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'SW_VERSION') {
      got = true;
      var s = String(e.data.v), m = /-((?:v|nf)?\d+)$/.exec(s);
      el.textContent = '🏷️ 版本 ' + (m ? m[1] : s) + '(這台裝置實際執行中的版本)';
    }
  });
  function ask() { var c = navigator.serviceWorker.controller; if (c) c.postMessage('GET_VERSION'); }
  navigator.serviceWorker.ready.then(ask).catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', ask);
  setTimeout(function () {
    if (got) return;
    if (!navigator.serviceWorker.controller) el.textContent = '🏷️ 版本 —(強制重新整理的分頁問不到;普通重整一次即顯示)';
    else { ask(); setTimeout(function () { if (!got) el.textContent = '🏷️ 版本 —(讀不到,重整一次即顯示)'; }, 1500); }
  }, 1600);
})();
</script>
